services:

  log-generator:
    image: python:3.10-slim
    container_name: log-generator
    volumes:
      - ./app:/app
      - ./flume/logs:/opt/flume/logs
    working_dir: /app
    command: python -u gerador.py
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  jobmanager:
    image: apache/flink:1.20.1-scala_2.12-java11
    container_name: jobmanager
    command: jobmanager
    ports:
      - '8081:8081'
    environment:
      - 'FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager'

  taskmanager:
    image: apache/flink:1.20.1-scala_2.12-java11
    container_name: taskmanager
    command: taskmanager
    environment:
      - 'FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager'

  flume-agent:
    image: probablyfine/flume:latest
    container_name: flume-agent
    environment:
      - 'FLUME_AGENT_NAME=agente_python'
    volumes:
      - ./flume/conf:/opt/flume-config
      - ./flume/logs:/opt/flume/logs
    depends_on:
      - log-generator
      - kafka
    restart: always 