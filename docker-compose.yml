services:

  log-generator:
    image: python:3.10-slim
    container_name: log-generator
    volumes:
      - ./app:/app
      - ./flume/logs:/opt/flume/logs
    working_dir: /app
    command: python -u gerador.py
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  jobmanager:
    build:
      context: ./flink
    image: trabalho-big-data/flink:1.20.1-kafka
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"

  taskmanager:
    build:
      context: ./flink
    image: trabalho-big-data/flink:1.20.1-kafka
    container_name: taskmanager
    command: taskmanager
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"

  flume-agent:
    image: probablyfine/flume:latest
    container_name: flume-agent
    environment:
      - "FLUME_AGENT_NAME=agente_python"
    volumes:
      - ./flume/conf:/opt/flume-config
      - ./flume/logs:/opt/flume/logs
    depends_on:
      - log-generator
      - kafka
    restart: always

  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=trend-topics-result
    depends_on:
      - kafka
    restart: always

  namenode:
    command:
      - bash
      - -c
      - |
        if [ ! -d /opt/hadoop/dfs/name/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        hdfs namenode
    container_name: namenode
    environment:
      HDFS_DATANODE_USER: root
      HDFS_NAMENODE_USER: root
      HDFS_SECONDARYNAMENODE_USER: root
    hostname: namenode
    image: apache/hadoop:3.3.6
    ports:
      - "9870:9870"
      - "9000:9000"
    restart: unless-stopped
    user: root
    volumes:
      - namenode_data:/opt/hadoop/dfs/name
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

  datanode:
    command:
      - bash
      - -c
      - |
        hdfs datanode
    container_name: datanode
    depends_on:
      namenode:
        condition: service_started
    environment:
      HDFS_DATANODE_USER: root
      HDFS_NAMENODE_USER: root
      HDFS_SECONDARYNAMENODE_USER: root
    hostname: datanode
    image: apache/hadoop:3.3.6
    ports:
      - "9864:9864"
    restart: unless-stopped
    user: root
    volumes:
      - datanode_data:/opt/hadoop/dfs/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

volumes:
  namenode_data:
  datanode_data: